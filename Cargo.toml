[package]
name = "heyclaude"
version = "0.2.0"
edition = "2024"
description = "按项目分组管理 Claude Code 后台任务的终端 TUI（不修改 Claude Code 本身）"
license = "MIT"

[[bin]]
name = "hcc"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
libc = "0.2"
notify = "8"
ratatui = "0.30"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
